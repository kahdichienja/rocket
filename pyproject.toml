[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sha-claim"
version = "0.1.4"
description = "Python SDK for Kenya SHA claims via the DHA AfyaConnect HIE eClaims API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "NaCare" }]
keywords = ["sha", "kenya", "health", "claims", "afyaconnect", "dha", "hie"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "respx>=0.21",
  "hypothesis>=6",
  "ruff>=0.6",
  "mypy>=1.11",
  "import-linter>=2",
  "python-dotenv>=1",
]

[project.urls]
Homepage = "https://github.com/kahdichienja/rocket"
Documentation = "https://github.com/kahdichienja/rocket/blob/main/docs/GUIDE.md"
Changelog = "https://github.com/kahdichienja/rocket/blob/main/CHANGELOG.md"
Issues = "https://github.com/kahdichienja/rocket/issues"

[tool.hatch.build.targets.sdist]
include = ["src/sha_claim", "tests", "docs/api/spec", "docs/GUIDE.md", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/sha_claim"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "BLE", "N", "RUF", "SIM", "PT"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PT011", "PT018"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["respx.*", "hypothesis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: hits the DHA UAT environment (network, credentials); off by default"]
addopts = "-m 'not live' --strict-markers"

[tool.coverage.run]
source = ["sha_claim"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "\\.\\.\\."]

[tool.importlinter]
root_package = "sha_claim"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain imports nothing from outer layers"
type = "forbidden"
source_modules = ["sha_claim.domain"]
forbidden_modules = ["sha_claim.ports", "sha_claim.use_cases", "sha_claim.adapters", "sha_claim.infrastructure", "sha_claim.client", "sha_claim.settings", "httpx", "pydantic"]

[[tool.importlinter.contracts]]
name = "Use cases depend only on domain and ports"
type = "forbidden"
source_modules = ["sha_claim.use_cases", "sha_claim.ports"]
forbidden_modules = ["sha_claim.adapters", "sha_claim.infrastructure", "sha_claim.client", "httpx", "pydantic"]

[[tool.importlinter.contracts]]
name = "Adapters never touch the network library"
type = "forbidden"
source_modules = ["sha_claim.adapters"]
forbidden_modules = ["sha_claim.infrastructure", "sha_claim.client", "httpx"]
